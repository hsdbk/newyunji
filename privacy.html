<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>隐私政策 - 派对兔</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding-bottom: 60px;
        }
        
        .container {
            max-width: 768px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .header {
            position: sticky;
            top: 0;
            background-color: #fff;
            padding: 15px 0;
            margin: -20px -20px 20px -20px;
            padding-left: 20px;
            padding-right: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            z-index: 100;
            display: flex;
            align-items: center;
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #666;
            cursor: pointer;
        }
        
        .title {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            flex: 1;
            margin-right: 40px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #000;
            padding-bottom: 8px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .content {
            font-size: 15px;
            line-height: 1.8;
        }
        
        .content p {
            margin-bottom: 15px;
            color: #666;
        }
        
        .content p strong {
            color: #000;
            font-weight: bold;
        }
        
        .content p:last-child {
            margin-bottom: 0;
        }
        
        .highlight {
            color: #ff481c;
        }
        
        .date-info {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
        }
        
        .toc {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .toc-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #000;
        }
        
        .toc-item {
            margin: 8px 0;
            color: #666;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header {
                margin: -15px -15px 20px -15px;
                padding-left: 15px;
                padding-right: 15px;
            }
            
            .title {
                font-size: 17px;
            }
            
            .content {
                font-size: 14px;
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="back-btn">←</div>
            <div class="title">隐私政策</div>
        </div>
        <div id="privacy-content">
            <!-- 隐私政策内容将通过 jQuery 动态加载 -->
        </div>
    </div>
    
    <script>
        // 返回按钮功能
        document.querySelector('.back-btn')?.addEventListener('click', function() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // 如果是直接打开的页面，提示用户
                alert('无法返回');
            }
        });
        
        // 适配不同设备
        function adaptToDevice() {
            const container = document.querySelector('.container');
            const width = window.innerWidth;
            if (width > 768) {
                container.style.width = '768px';
                container.style.margin = '0 auto';
            } else {
                container.style.width = '100%';
                container.style.margin = '0';
            }
        }
        
        // 初始化适配
        adaptToDevice();
        
        // 监听窗口大小变化
        window.addEventListener('resize', adaptToDevice);
        
        // 使用 jQuery 调用接口获取隐私政策内容
        $(document).ready(function() {
            $.ajax({
                url: 'https://h5.aztym.com/article/article/privacyPolicy',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response.code === 200 && response.data && response.data.content) {
                        $('#privacy-content').html(response.data.content);
                    } else {
                        $('#privacy-content').html('<p>隐私政策内容加载失败，请稍后重试</p>');
                    }
                },
                error: function() {
                    $('#privacy-content').html('<p>网络错误，隐私政策内容加载失败</p>');
                }
            });
        });
    </script>
</body>
</html>
